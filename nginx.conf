server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # tipos que o navegador precisa reconhecer pro PWA funcionar: sem o
    # Content-Type certo o Chrome recusa registrar o service worker.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json  webmanifest json;
    }

    # Cabecalhos de resposta -- nao mudam o que o app faz, mudam o que o
    # navegador permite fazer com ele. Mesma auditoria feita no Coliseu.
    # CSP fica de fora de proposito: e a unica que pode quebrar a tela.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # O service worker NAO pode ficar preso em cache do navegador: se ficar, o
    # app trava numa versao antiga e a pessoa nunca recebe atualizacao nenhuma.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # index.html e app.js mantem o mesmo nome a cada build, entao tambem
    # precisam ser revalidados -- senao o deploy novo nao chega em quem ja
    # abriu o app antes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /app.js {
        add_header Cache-Control "no-cache";
    }

    # react, react-dom e tailwind sao versoes fixas: podem ficar em cache
    # pra sempre, o que deixa a abertura do app bem mais rapida.
    location /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json;
    gzip_min_length 1024;
}
