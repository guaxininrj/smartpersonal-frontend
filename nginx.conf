server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # tipos que o navegador precisa reconhecer pro PWA funcionar: sem o
    # Content-Type certo o Chrome recusa registrar o service worker.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json  webmanifest json;
    }

    # Cabecalhos de seguranca num arquivo a parte, incluido em CADA location
    # que declara o proprio add_header (todos, por causa do Cache-Control) --
    # ver o comentario dentro de security-headers.conf pro motivo: nginx para
    # de herdar TODOS os add_header do server{} assim que um location declara
    # o proprio, mesmo que seja so pra outro header.
    include /etc/nginx/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
    }

    # O service worker NAO pode ficar preso em cache do navegador: se ficar, o
    # app trava numa versao antiga e a pessoa nunca recebe atualizacao nenhuma.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # index.html e app.js mantem o mesmo nome a cada build, entao tambem
    # precisam ser revalidados -- senao o deploy novo nao chega em quem ja
    # abriu o app antes.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
    location = /app.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # react, react-dom e tailwind sao versoes fixas: podem ficar em cache
    # pra sempre, o que deixa a abertura do app bem mais rapida.
    location /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json;
    gzip_min_length 1024;
}
