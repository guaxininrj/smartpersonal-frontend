<html lang="pt-BR"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>Smart Coliseu</title>

<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="./vendor/tailwind.js"></script>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script>
  /* se o cdn.tailwindcss.com falhar (sem internet, bloqueio de rede, etc.),
     "tailwind" não existe — evita que esse script quebre e impeça o resto
     da página de rodar. */
  if (typeof tailwind !== "undefined") {
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "rgb(var(--c-bg) / <alpha-value>)",
            surface: "rgb(var(--c-surface) / <alpha-value>)",
            surface2: "rgb(var(--c-surface2) / <alpha-value>)",
            border: "rgb(var(--c-border) / <alpha-value>)",
            borderSoft: "rgb(var(--c-borderSoft) / <alpha-value>)",
            red: "#d60000",
            redDim: "#7a0000",
            redGlow: "#ff1a1a",
            gold: "#e0a530",
            goldDim: "#7a5b12",
            goldGlow: "#ffcf5c",
            text: "rgb(var(--c-text) / <alpha-value>)",
            textMuted: "rgb(var(--c-textMuted) / <alpha-value>)",
            textFaint: "rgb(var(--c-textFaint) / <alpha-value>)",
          },
          fontFamily: {
            display: ['"Space Grotesk"', "sans-serif"],
            body: ['"Inter"', "sans-serif"],
          },
        },
      },
    };
  }
</script>

<script>
  /* vigia: o fundo da página já é preto via CSS (independente do app carregar
     ou não). Cobre dois cenários que deixam a pessoa numa tela preta sem
     nenhum aviso:
     1) React, ReactDOM, Babel ou Tailwind falharam ao carregar do CDN
        (geralmente por falta de internet).
     2) as libs carregaram certinho, mas algum erro de JavaScript aconteceu
        ANTES do React conseguir montar o app (esse caso o ErrorBoundary lá
        embaixo não pega, porque ele só existe depois que o React já montou). */
  var erroCapturado = null;
  window.addEventListener("error", function (e) {
    erroCapturado = e.error ? (e.error.message || String(e.error)) : e.message;
  });

  function mostrarFalha(motivo) {
    var root = document.getElementById("root");
    if (!root || root.hasChildNodes()) return; // o app já montou normalmente, não mexe
    root.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#f5f5f5;font-family:Inter,sans-serif;">' +
      '<div style="max-width:420px;">' +
      '<div style="font-size:40px;margin-bottom:12px;">\u26A0\uFE0F</div>' +
      '<h2 style="font-size:18px;font-weight:600;margin-bottom:8px;">N\u00E3o foi poss\u00EDvel carregar o app</h2>' +
      '<p style="font-size:14px;color:#9a9a9a;margin-bottom:8px;">' + motivo + "</p>" +
      '<button onclick="window.location.reload()" style="margin-top:16px;padding:8px 20px;border-radius:8px;background:#d60000;color:#fff;border:none;font-size:14px;cursor:pointer;">Recarregar</button>' +
      "</div></div>";
  }

  window.addEventListener("load", function () {
    setTimeout(function () {
      var faltando = [];
      if (typeof React === "undefined") faltando.push("React");
      if (typeof ReactDOM === "undefined") faltando.push("ReactDOM");
      if (typeof tailwind === "undefined") faltando.push("Tailwind");

      if (faltando.length > 0) {
        mostrarFalha(
          "Faltou carregar: " + faltando.join(", ") +
          ". Tente recarregar a página."
        );
      } else if (erroCapturado) {
        mostrarFalha("Erro técnico: " + erroCapturado);
      }
    }, 4000);
  });
</script>

<style>
  /* ---------- tema: dark (padrão) ---------- */
  :root, html[data-theme="dark"] {
    --c-bg: 5 5 5;
    --c-surface: 14 14 14;
    --c-surface2: 21 21 21;
    --c-border: 35 35 35;
    --c-borderSoft: 26 26 26;
    --c-text: 245 245 245;
    --c-textMuted: 154 154 154;
    --c-textFaint: 92 92 92;
    --c-card-grad-1: 21 21 21;
    --c-card-grad-2: 14 14 14;
    --c-glass-bg: rgba(20, 20, 20, 0.55);
    --c-glass-border: rgba(255, 255, 255, 0.06);
    --c-input-bg: 21 21 21;
    --c-scrollbar: #232323;
  }
  /* ---------- tema: light ---------- */
  html[data-theme="light"] {
    --c-bg: 246 246 248;
    --c-surface: 255 255 255;
    --c-surface2: 240 240 243;
    --c-border: 224 224 229;
    --c-borderSoft: 232 232 236;
    --c-text: 17 17 20;
    --c-textMuted: 100 100 108;
    --c-textFaint: 150 150 158;
    --c-card-grad-1: 255 255 255;
    --c-card-grad-2: 246 246 248;
    --c-glass-bg: rgba(255, 255, 255, 0.65);
    --c-glass-border: rgba(0, 0, 0, 0.06);
    --c-input-bg: 255 255 255;
    --c-scrollbar: #d4d4d9;
  }

  html, body, #root { height: 100%; background: rgb(var(--c-bg)); }
  /* vinheta sutil + leve textura de ruído no fundo, pra tirar a sensação
     de "preto chapado" sem chamar atenção pra si mesma */
  body {
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(214,0,0,0.06), transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(224,165,48,0.04), transparent 60%);
    background-attachment: fixed;
  }
  html[data-theme="light"] body {
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(214,0,0,0.04), transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(224,165,48,0.05), transparent 60%);
  }
  .card { box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5); transition: box-shadow .2s ease, border-color .2s ease; }
  .card:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 12px 32px -12px rgba(0,0,0,0.6); }
  body { font-family: "Inter", sans-serif; color: rgb(var(--c-text)); -webkit-font-smoothing: antialiased; overscroll-behavior: none; transition: background-color .2s ease, color .2s ease; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--c-scrollbar); border-radius: 999px; }
  .font-display { font-family: "Space Grotesk", sans-serif; }
  .tabular { font-variant-numeric: tabular-nums; }

  .card {
    position: relative;
    background: linear-gradient(155deg, rgb(var(--c-card-grad-1)) 0%, rgb(var(--c-card-grad-2)) 100%);
    border: 1px solid rgb(var(--c-border));
    border-radius: 1rem;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--card-accent-bg, linear-gradient(
      180deg,
      #7a0000 0%,
      #ff4d4d 12%,
      #ffc2c2 20%,
      #d60000 32%,
      #6b0000 48%,
      #ff2b2b 62%,
      #ffd9d9 72%,
      #900000 86%,
      #ff6666 100%
    ));
    opacity: 0.95;
  }
  .glass {
    background: var(--c-glass-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--c-glass-border);
  }
  /* anéis metálicos da foto de perfil, por faixa de nível */
  .anel-nivel { display: inline-flex; padding: 4px; border-radius: 9999px; }
  .anel-bronze {
    background: linear-gradient(160deg,
      #d9a06a 0%, #9c5f2c 14%, #4a2a12 28%, #c9884c 42%,
      #5c3417 56%, #e0b383 68%, #3d220e 82%, #8c5a2b 100%);
  }
  .anel-prata {
    background: linear-gradient(160deg,
      #ffffff 0%, #a8a8a8 14%, #5c5c5c 28%, #e6e6e6 42%,
      #7d7d7d 56%, #ffffff 68%, #4a4a4a 82%, #c2c2c2 100%);
  }
  .anel-ouro {
    background: linear-gradient(160deg,
      #fff3b8 0%, #d4af37 14%, #7a5c12 28%, #ffe066 42%,
      #8a6d1f 56%, #fff9db 68%, #5c4610 82%, #e6c34d 100%);
  }
  .anel-diamante {
    background: linear-gradient(120deg,
      #9df3ff, #ff9dfa, #fff89d, #9dffb0, #9dc6ff, #ff9d9d, #9df3ff);
    background-size: 320% 320%;
    animation: furta-cor 6s ease infinite;
  }
  @keyframes furta-cor {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .text-eyebrow {
    font-family: "Space Grotesk", sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.68rem;
    color: rgb(var(--c-textFaint));
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(214,0,0,0.35); }
    50% { box-shadow: 0 0 0 6px rgba(214,0,0,0); }
  }
  .pulse-glow { animation: pulse-glow 2.2s ease-out infinite; }
  /* chama de fogo "vivinha": pequenas variações de escala/rotação simulando
     tremulação, mais um brilho laranja pulsando por baixo do emoji */
  @keyframes chama-tremular {
    0%, 100% { transform: scale(1, 1) rotate(0deg) translateY(0); }
    20% { transform: scale(1.08, 0.94) rotate(-4deg) translateY(-1px); }
    40% { transform: scale(0.95, 1.06) rotate(3deg) translateY(0); }
    60% { transform: scale(1.05, 0.96) rotate(-2deg) translateY(-1px); }
    80% { transform: scale(0.97, 1.04) rotate(3deg) translateY(0); }
  }
  @keyframes chama-brilho {
    0%, 100% { opacity: 0.5; transform: scale(0.9); }
    50% { opacity: 0.9; transform: scale(1.15); }
  }
  .chama-anim {
    display: inline-block;
    transform-origin: 50% 90%;
    animation: chama-tremular 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255,140,0,0.55));
  }
  .chama-brilho {
    position: absolute;
    inset: 0;
    border-radius: 9999px;
    background: radial-gradient(circle, rgba(255,140,0,0.35) 0%, rgba(255,140,0,0) 70%);
    animation: chama-brilho 1.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fade-up 0.4s ease both; }
  @keyframes confete-cair {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.9; }
  }
  .confete-particula { position: fixed; top: 0; width: 8px; height: 14px; border-radius: 1px; pointer-events: none; animation-name: confete-cair; animation-timing-function: cubic-bezier(.25,.1,.5,1); animation-fill-mode: forwards; z-index: 70; }
  @keyframes celebracao-pop {
    0% { opacity: 0; transform: scale(0.85) translateY(10px); }
    60% { opacity: 1; transform: scale(1.03) translateY(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .celebracao-card { animation: celebracao-pop 0.5s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes celebracao-icone {
    0%, 100% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.15) rotate(-8deg); }
    75% { transform: scale(1.15) rotate(8deg); }
  }
  .celebracao-icone { animation: celebracao-icone 0.9s ease-in-out 0.3s 2; }
  input[type="checkbox"] { accent-color: #d60000; }
  input, select, textarea {
    background: rgb(var(--c-input-bg)); border: 1px solid rgb(var(--c-border)); color: rgb(var(--c-text));
    border-radius: 0.5rem; padding: 0.625rem 0.75rem; font-size: 0.875rem; outline: none;
    transition: border-color .15s ease; width: 100%;
  }
  input::placeholder { color: rgb(var(--c-textFaint)); }
  input:focus, select:focus, textarea:focus { border-color: #d60000; }

  /* microinteração de toque: qualquer botão do app reage com um leve
     "afundar" ao ser pressionado — dá feedback tátil em telas touch,
     onde :hover não existe */
  button { transition: transform .12s ease, opacity .12s ease; }
  button:active:not(:disabled) { transform: scale(0.96); }
</style>

<script>
  /* registra o service worker (e o que permite instalar na tela inicial
     e abrir sem internet). Falha em silencio: se nao rolar, o app continua
     funcionando normal, so nao instala. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body></html>
