# Cabecalhos de resposta -- nao mudam o que o app faz, mudam o que o
# navegador permite fazer com ele. Mesma auditoria feita no Coliseu.
# CSP fica de fora de proposito: e a unica que pode quebrar a tela.
#
# NUM ARQUIVO SEPARADO E INCLUIDO EM CADA LOCATION, de proposito: o nginx
# tem uma regra pouco conhecida onde, se um "location" declara o PROPRIO
# add_header (aqui, todos declaram pra Cache-Control), ele para de herdar
# QUALQUER add_header do bloco "server" pai -- nao so o que foi
# redeclarado. Botar os 4 headers so no server{} os fazia sumir bem onde
# mais importa: a pagina principal, o app.js, o service worker. So
# sobrava no /manifest.json, que e o unico sem Cache-Control proprio.
# Achado testando de fora depois do primeiro deploy, nao só por leitura.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
